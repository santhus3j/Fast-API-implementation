name: Money Mentor CI

on:
  push:
    branches: [main]
    paths:
      - "Gen AI project/**"
      - ".github/workflows/money-mentor.yml"
  pull_request:
    branches: [main]
    paths:
      - "Gen AI project/**"
      - ".github/workflows/money-mentor.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r "Gen AI project/requirements.txt"

      - name: Check Python syntax
        run: python -m compileall -q "Gen AI project/app"
